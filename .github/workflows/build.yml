name: Build unsigned IPA

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Cache XcodeGen Homebrew installation to speed up runner execution
      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-xcodegen-${{ hashFiles('**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-xcodegen-

      - name: Select newest stable Xcode
        run: |
          echo "Installed Xcode versions:"; ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi -e beta -e "_rc" | sort -V | tail -n 1 || true)
          if [ -z "$XC" ]; then XC=/Applications/Xcode.app; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install Metal toolchain (needed by newer Xcode, harmless otherwise)
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Show toolchain
        run: |
          xcrun --sdk iphoneos --show-sdk-version
          xcrun -sdk iphoneos metal --version || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Cache DerivedData compilation outputs across runs
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift', '**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Build (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild \
            -project MotionForge.xcodeproj \
            -scheme MotionForge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "MotionForge.app" | head -n 1)
          echo "App bundle: $APP"
          test -f "$APP/MotionForge" || { echo "Compiled executable missing"; exit 1; }
          test -f "$APP/default.metallib" || { echo "Metal library missing"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          rm -rf Payload/MotionForge.app/_CodeSignature
          zip -qry MotionForge-unsigned.ipa Payload
          cp MotionForge-unsigned.ipa MotionForge-unsigned.tipa   # same file; TrollStore expects .tipa
          echo "--- archive top level ---"; unzip -Z1 MotionForge-unsigned.ipa | head -n 8
          ls -lh MotionForge-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4.4.3
        with:
          name: MotionForge-unsigned-ipa
          path: |
            MotionForge-unsigned.ipa
            MotionForge-unsigned.tipa

      - name: Upload Payload folder (the raw .app, for tools that want it unzipped)
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Payload
          path: Payload/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
